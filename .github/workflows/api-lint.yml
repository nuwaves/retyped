name: API lint

on:
  push:
    paths:
      - apps/api/**
      - .github/workflows/api-*.yml
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/api-*.yml
  # Called by the API deploy workflow so deploys wait for lint.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.16.10

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
